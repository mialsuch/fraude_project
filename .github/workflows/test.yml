name: Tests

# Ejecuta las pruebas en cada pull request y en cada push a main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Poetry
        run: pip install poetry
      - name: Instalar dependencias desde poetry.lock
        run: poetry install --no-interaction
      - name: Tests
        run: poetry run pytest -v